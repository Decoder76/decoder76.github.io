<!-- Floating Trigger Button -->
<div class="fixed bottom-6 right-6 z-50">
  <button 
    id="aiToggleBtn" 
    onclick="toggleChatWidget()"
    class="bg-amber-500 hover:bg-amber-400 text-slate-950 p-4 rounded-full shadow-2xl shadow-amber-500/30 flex items-center justify-center transition-all duration-300 transform hover:scale-105"
    aria-label="Toggle AI Assistant"
  >
    <svg id="aiOpenIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
    </svg>
    <svg id="aiCloseIcon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
    </svg>
  </button>
</div>

<!-- Floating Chat Popup Modal -->
<div 
  id="aiChatModal" 
  class="fixed bottom-24 right-6 z-50 w-[92vw] sm:w-[420px] h-[550px] bg-slate-900/95 border border-slate-800 backdrop-blur-md rounded-2xl shadow-2xl flex flex-col overflow-hidden hidden transition-all duration-300 transform origin-bottom-right"
>
  <!-- Header -->
  <div class="px-5 py-3.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <div>
        <h3 class="text-xs font-bold text-white tracking-wide uppercase">Lokesh's Assistant</h3>
        <p class="text-[10px] text-slate-400 font-mono">Dynamic Collections Core</p>
      </div>
    </div>
    <button onclick="toggleChatWidget()" class="text-slate-400 hover:text-white text-xs p-1">✕</button>
  </div>

  <!-- Quick Prompts Bar -->
  <div class="px-4 py-2 bg-slate-950/60 border-b border-slate-800/80 flex gap-1.5 overflow-x-auto text-[11px] scrollbar-none">
    <button onclick="sendQuickWidgetPrompt('What projects have you built?')" class="whitespace-nowrap px-2.5 py-0.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300">🚀 Projects</button>
    <button onclick="sendQuickWidgetPrompt('What is your tech stack?')" class="whitespace-nowrap px-2.5 py-0.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300">⚡ Stack</button>
    <button onclick="sendQuickWidgetPrompt('Tell me about your experience')" class="whitespace-nowrap px-2.5 py-0.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300">💼 Experience</button>
  </div>

  <!-- Chat History -->
  <div id="widgetMessages" class="flex-1 overflow-y-auto p-4 space-y-3 text-xs">
    <div class="flex items-start gap-2.5">
      <div class="w-6 h-6 rounded bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 text-[10px] font-bold flex-shrink-0">AI</div>
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl rounded-tl-none px-3.5 py-2.5 text-slate-200 leading-relaxed max-w-[85%]">
        Hello! I can explain Lokesh's project architectures, APIs, and machine learning models. What would you like to explore?
      </div>
    </div>
  </div>

  <!-- Input Form -->
  <div class="p-3 bg-slate-950 border-t border-slate-800">
    <form id="widgetChatForm" class="flex gap-1.5">
      <input 
        type="text" 
        id="widgetInput" 
        placeholder="Ask about FastAPI, Bi-LSTM, LMS..." 
        autocomplete="off"
        class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500"
      />
      <button 
        type="submit" 
        class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3.5 py-2 rounded-lg text-xs"
      >
        Send
      </button>
    </form>
  </div>
</div>

<!-- Dynamic Knowledge Feed -->
<script id="widget-knowledge-feed" type="application/json">
[
  {% for project in site.projects %}
  {
    "type": "project",
    "title": {{ project.title | jsonify }},
    "url": {{ project.url | relative_url | jsonify }},
    "keywords": [
      {{ project.title | downcase | jsonify }},
      {% if project.stack %}{% for s in project.stack %}{{ s | downcase | jsonify }},{% endfor %}{% endif %}
      "project", "architecture", "api", "model"
    ],
    "content": {{ project.content | strip_html | normalize_whitespace | truncate: 350 | jsonify }}
  },
  {% endfor %}

  {% for skill in site.data.skills %}
  {
    "type": "skills",
    "title": {{ skill.category | jsonify }},
    "keywords": ["skills", "stack", "tools", {{ skill.category | downcase | jsonify }}, {% for item in skill.items %}{{ item | downcase | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}],
    "content": "Core competencies in <strong>{{ skill.category }}</strong>: {{ skill.items | join: ', ' }}."
  },
  {% endfor %}

  {% for exp in site.data.experience %}
  {
    "type": "experience",
    "title": {{ exp.title | jsonify }},
    "keywords": ["experience", "work", "career", {{ exp.title | downcase | jsonify }}, {{ exp.organization | downcase | jsonify }}],
    "content": "<strong>{{ exp.title }}</strong> at <strong>{{ exp.organization }}</strong> ({{ exp.period }}): {{ exp.description }}"
  },
  {% endfor %}

  {
    "type": "contact",
    "title": "Contact",
    "keywords": ["contact", "email", "github", "reach", "location"],
    "content": "Lokesh Kumar Jayswal is based in Gorakhpur, UP, India. GitHub: <a href='https://github.com/Decoder76' target='_blank' class='text-amber-400 underline'>github.com/Decoder76</a>."
  }
]
</script>

<script>
let widgetKnowledge = [];

function toggleChatWidget() {
  const modal = document.getElementById("aiChatModal");
  const openIcon = document.getElementById("aiOpenIcon");
  const closeIcon = document.getElementById("aiCloseIcon");

  modal.classList.toggle("hidden");
  openIcon.classList.toggle("hidden");
  closeIcon.classList.toggle("hidden");

  if (!modal.classList.contains("hidden")) {
    document.getElementById("widgetInput").focus();
  }
}

document.addEventListener("DOMContentLoaded", () => {
  try {
    const rawFeed = document.getElementById("widget-knowledge-feed").textContent;
    widgetKnowledge = JSON.parse(rawFeed) || [];
  } catch (err) {
    console.error("Widget feed error:", err);
  }

  const widgetMessages = document.getElementById("widgetMessages");
  const widgetChatForm = document.getElementById("widgetChatForm");
  const widgetInput = document.getElementById("widgetInput");

  function appendWidgetMessage(sender, text) {
    const isUser = sender === "User";
    const wrapper = document.createElement("div");
    wrapper.className = `flex items-start gap-2.5 ${isUser ? "flex-row-reverse" : ""}`;

    const avatar = document.createElement("div");
    avatar.className = isUser
      ? "w-6 h-6 rounded bg-slate-700 flex items-center justify-center text-white text-[10px] font-bold flex-shrink-0"
      : "w-6 h-6 rounded bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 text-[10px] font-bold flex-shrink-0";
    avatar.innerText = isUser ? "YOU" : "AI";

    const bubble = document.createElement("div");
    bubble.className = isUser
      ? "bg-amber-500 text-slate-950 font-medium rounded-xl rounded-tr-none px-3.5 py-2.5 leading-relaxed max-w-[85%]"
      : "bg-slate-800/80 border border-slate-700/60 rounded-xl rounded-tl-none px-3.5 py-2.5 text-slate-200 leading-relaxed max-w-[85%]";
    bubble.innerHTML = text;

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
    widgetMessages.appendChild(wrapper);
    widgetMessages.scrollTop = widgetMessages.scrollHeight;
  }

  function queryWidgetEngine(query) {
    const clean = query.toLowerCase().trim();
    const greetings = ["hi", "hello", "hey", "who are you"];
    if (greetings.some(g => clean === g || clean.startsWith(g + " "))) {
      return "Hello! I am indexed directly from Lokesh's project architectures and technical case studies. Ask about any backend system or machine learning model.";
    }

    if (!widgetKnowledge.length) return "Assistant indexing dynamic feed...";

    const tokens = clean.replace(/[^\w\s]/gi, '').split(/\s+/).filter(Boolean);
    let topScore = 0;
    let match = null;

    widgetKnowledge.forEach(item => {
      let score = 0;
      const title = (item.title || "").toLowerCase();
      const content = (item.content || "").toLowerCase();
      const keywords = (item.keywords || []).map(k => String(k).toLowerCase());

      tokens.forEach(token => {
        if (title.includes(token)) score += 6;
        if (keywords.some(k => k.includes(token))) score += 4;
        if (content.includes(token)) score += 2;
      });

      if (score > topScore) {
        topScore = score;
        match = item;
      }
    });

    if (topScore > 0 && match) {
      if (match.type === "project") {
        return `<strong>${match.title}</strong><br>${match.content}<br><a href="${match.url}" class="text-amber-400 underline font-semibold mt-1 inline-block">Examine Architecture &rarr;</a>`;
      }
      return match.content;
    }

    return "No exact match found in current case studies. You can check the <a href='{{ '/pages/projects/' | relative_url }}' class='text-amber-400 underline'>Projects page</a> or <a href='{{ '/pages/resume/' | relative_url }}' class='text-amber-400 underline'>Resume</a>.";
  }

  window.sendQuickWidgetPrompt = function(txt) {
    widgetInput.value = txt;
    widgetChatForm.dispatchEvent(new Event("submit"));
  };

  widgetChatForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = widgetInput.value.trim();
    if (!q) return;

    appendWidgetMessage("User", q);
    widgetInput.value = "";

    setTimeout(() => {
      const ans = queryWidgetEngine(q);
      appendWidgetMessage("AI", ans);
    }, 150);
  });
});
</script>
