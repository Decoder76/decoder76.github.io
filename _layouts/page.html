<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <style>
      :root {
        --bg: #07110f;
        --panel: rgba(8, 24, 20, 0.92);
        --text: #ebfff8;
        --muted: #a4d6c8;
        --line: rgba(109, 255, 208, 0.18);
        --signal: #7fffd4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: "Space Grotesk", system-ui, sans-serif;
        line-height: 1.7;
        background:
          radial-gradient(circle at top left, rgba(74, 227, 181, 0.15), transparent 34%),
          linear-gradient(135deg, #020807 0%, #07110f 52%, #03110d 100%);
      }

      a {
        color: var(--signal);
      }

      .shell {
        width: min(860px, 92%);
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }

      .topbar {
        padding: 1rem 0 1.4rem;
      }

      .topbar a {
        text-decoration: none;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: var(--panel);
        padding: 1.4rem;
      }

      h1, h2, h3 {
        line-height: 1.1;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p, li {
        color: var(--muted);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
      }

      th, td {
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 8px 12px;
        text-align: left;
      }
      
      th {
        background-color: rgba(255, 255, 255, 0.05);
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="topbar"><a href="/">← Back to home</a></div>
      <article class="panel">
        {{ content }}
      </article>
    </main>
    <!-- Mermaid.js Runtime Engine -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ 
    startOnLoad: false, 
    theme: 'dark',
    securityLevel: 'loose'
  });

  document.addEventListener("DOMContentLoaded", async function () {
    // Selects both standard Jekyll/Rouge wrappers and plain pre/code blocks
    const mermaidElements = document.querySelectorAll(
      'div.language-mermaid, pre.language-mermaid, pre code.language-mermaid'
    );

    mermaidElements.forEach((el) => {
      const rawCode = el.querySelector('code') ? el.querySelector('code').innerText : el.innerText;
      const container = document.createElement('div');
      container.className = 'mermaid flex justify-center my-6';
      container.textContent = rawCode.trim();
      el.replaceWith(container);
    });

    await mermaid.run();
  });
</script>
  </body>
</html>
