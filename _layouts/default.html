<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    
    <!-- External Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary-amber: #f59e0b; }
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .brand-font { font-family: 'Space Grotesk', sans-serif; }
        .hero-gradient { background: radial-gradient(circle at top right, #1e293b, #020617); }
        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-link { position: relative; transition: color 0.3s; color: #94a3b8; font-weight: 500; }
        .nav-link:hover { color: var(--primary-amber); }
        .chart-container { position: relative; width: 100%; max-width: 450px; margin: auto; height: 320px; }
        
        /* Markdown Content Styling */
        .prose h1, .prose h2, .prose h3 { font-family: 'Space Grotesk', sans-serif; color: #f8fafc; margin-top: 2rem; margin-bottom: 1rem; font-weight: 700; }
        .prose h1 { font-size: 2.25rem; }
        .prose h2 { font-size: 1.5rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; }
        .prose p { margin-bottom: 1.25rem; line-height: 1.8; color: #cbd5e1; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; color: #cbd5e1; margin-bottom: 1.25rem; }
        .prose li { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="antialiased">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{{ site.baseurl }}/" class="brand-font text-xl font-bold tracking-tight text-amber-500">LOKESH.AI</a>
            <div class="hidden md:flex space-x-8 text-sm">
                <a href="{{ site.baseurl }}/" class="nav-link">Dashboard</a>
                <a href="{{ site.baseurl }}/pages/projects/" class="nav-link">Projects</a>
                <a href="{{ site.baseurl }}/pages/about/" class="nav-link">About</a>
                <a href="{{ site.baseurl }}/pages/resume/" class="nav-link">Resume</a>
            </div>
            <a href="mailto:{{ site.email }}" class="bg-amber-500 text-slate-950 px-5 py-2 rounded-lg text-sm font-bold hover:bg-amber-400 transition-all">Hire Me</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="pt-20">
        {{ content }}
    </div>

    <!-- Footer -->
    <footer class="bg-slate-950 py-16 border-t border-slate-900 mt-20">
        <div class="max-w-6xl mx-auto px-6 text-center md:text-left md:flex md:justify-between md:items-center">
            <div>
                <h2 class="brand-font text-2xl font-bold text-slate-100 mb-2">Lokesh Kumar Jayswal</h2>
                <p class="text-slate-500 text-sm">Engineering secure, modular AI and Backend systems.</p>
            </div>
            <div class="mt-8 md:mt-0">
                <div class="flex justify-center md:justify-end gap-6 mb-4 text-sm">
                    <a href="https://linkedin.com/in/{{ site.linkedin_username }}" class="text-slate-400 hover:text-amber-500 transition-colors">LinkedIn</a>
                    <a href="https://github.com/{{ site.github_username }}" class="text-slate-400 hover:text-slate-100 transition-colors">GitHub</a>
                </div>
                <p class="text-slate-600 text-xs">© {{ "now" | date: "%Y" }} • Built with Jekyll & Engineering Discipline.</p>
            </div>
        </div>
    </footer>
    </script>
    
<!-- Bottom of index.html -->
{% include ai-widget.html %}
</body>
</html>
