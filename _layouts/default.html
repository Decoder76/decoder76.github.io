<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta name="keywords" content="AI Engineer portfolio, FastAPI, machine learning, backend architecture, Python, Lokesh Kumar Jayswal" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Person","name":"Lokesh Kumar Jayswal","jobTitle":"AI Engineer & Backend Developer","url":"{{ site.url }}","sameAs":["https://github.com/{{ site.github_username }}","https://linkedin.com/in/{{ site.linkedin_username }}"]}
  </script>
  <style>body{font-family:Inter,sans-serif;background:#020617;color:#e2e8f0}.mono{font-family:'JetBrains Mono',monospace}.brand{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body>
  {% include header.html %}
  <main class="max-w-6xl mx-auto px-4 py-8">{{ content }}</main>
  {% include footer.html %}
</body>
</html>
